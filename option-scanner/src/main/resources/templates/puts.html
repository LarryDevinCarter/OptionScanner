<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <h2>Top Put Opportunities</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Ticker</th>
            <th>Strike</th>
            <th>Premium</th>
            <th>PoP</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="put : ${puts}">
            <td th:text="${put.ticker}"></td>
            <td th:text="${#numbers.formatDecimal(put.strike, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(put.premium, 1, 2)}"></td>
            <td th:text="${#numbers.formatPercent(put.pop, 0, 0)}"></td>
        </tr>
        </tbody>
    </table>
</th:block>
</body>
</html>
