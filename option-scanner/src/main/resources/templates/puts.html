<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Option Scanner - Puts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<div class="container mt-4">
    <h2>Top Put Opportunities</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Ticker</th>
            <th>Strike</th>
            <th>Premium</th>
            <th>PoP</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="put : ${puts}">
            <td th:text="${put.ticker}"></td>
            <td th:text="${#numbers.formatDecimal(put.strike, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(put.premium, 1, 2)}"></td>
            <td th:text="${#numbers.formatPercent(put.pop, 0, 0)}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
