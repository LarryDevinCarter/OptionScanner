<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Option Scanner - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<div class="container mt-4">
    <h2>Portfolio</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Ticker</th>
            <th>Shares</th>
            <th>Cost Basis</th>
            <th>Acquisition Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${portfolio}">
            <td th:text="${entry.ticker}"></td>
            <td th:text="${entry.shares}"></td>
            <td th:text="${#numbers.formatDecimal(entry.costBasis, 1, 2)}"></td>
            <td th:text="${entry.acquisitionDate}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Add Portfolio Entry</h3>
    <form th:action="@{/portfolio}" th:object="${portfolioInput}" method="post">
        <div class="mb-3">
            <label for="ticker" class="form-label">Ticker</label>
            <input type="text" class="form-control" id="ticker" th:field="*{ticker}">
            <div class="text-danger" th:errors="*{ticker}"></div>
        </div>
        <div class="mb-3">
            <label for="shares" class="form-label">Shares</label>
            <input type="number" class="form-control" id="shares" th:field="*{shares}">
            <div class="text-danger" th:errors="*{shares}"></div>
        </div>
        <div class="mb-3">
            <label for="costBasis" class="form-label">Cost Basis</label>
            <input type="number" step="0.01" class="form-control" id="costBasis" th:field="*{costBasis}">
            <div class="text-danger" th:errors="*{costBasis}"></div>
        </div>
        <div class="mb-3">
            <label for="acquisitionDate" class="form-label">Acquisition Date (YYYY-MM-DD)</label>
            <input type="date" class="form-control" id="acquisitionDate" th:field="*{acquisitionDate}">
            <div class="text-danger" th:errors="*{acquisitionDate}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>
</div>
</body>
</html>
